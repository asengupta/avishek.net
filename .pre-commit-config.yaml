repos:
  - repo: local
    hooks:
      - id: talisman
        name: talisman
        entry: bash -c '$HOME/.talisman/bin/talisman_darwin_arm64 --githook pre-commit'
        language: system
        pass_filenames: false
  - repo: local
    hooks:
      - id: terminology-guard
        name: Terminology Guard
        entry: precommit-scripts/check-terminology
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: terminology-commit-msg
        name: Terminology Guard (commit message)
        entry: precommit-scripts/check-commit-msg
        language: script
        stages: [commit-msg]

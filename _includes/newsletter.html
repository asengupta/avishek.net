{% if site.buttondown_slug %}
<div class="newsletter-container">
  <form
        action="https://buttondown.com/api/emails/embed-subscribe/{{ site.buttondown_slug }}"
        method="post"
        target="popupwindow"
        onsubmit="window.open('https://buttondown.com/{{ site.buttondown_slug }}', 'popupwindow')"
        class="embeddable-buttondown-form"
  >
    <label for="bd-email">Enter your email to receive updates</label>
    <input type="email" name="email" id="bd-email" placeholder="your@email.com" />
    <input type="submit" value="Subscribe" />
  </form>
</div>
{% endif %}
